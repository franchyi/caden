[project]
name = "caden"
version = "0.1.0"
description = "Stage-aware scheduling and memory residency for agent sandboxes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
tools = [
    "datasets>=4.8.5",
    "fastapi>=0.136.3",
    "matplotlib>=3.10.9",
    "python-multipart>=0.0.30",
    "uvicorn>=0.48.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["caden*"]

[tool.pyrefly]
search_path = ["./"]

[tool.ruff]
src = ["."]
