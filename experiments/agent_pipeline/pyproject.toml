[project]
name = "agent-pipeline"
version = "0.1.0"
description = "No-tools model + owned-sandbox coding-agent trace pipeline"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "datasets>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent_pipeline*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
